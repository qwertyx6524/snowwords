<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#4682B4"/>
  
  <!-- Detailed Snowflake Structure -->
  <g fill="none" stroke="#F8F9FA" stroke-width="2">
    <!-- Main Axes -->
    <line x1="32" y1="8" x2="32" y2="56" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="32" x2="56" y2="32" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14.8" y1="14.8" x2="49.2" y2="49.2" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14.8" y1="49.2" x2="49.2" y2="14.8" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Vertical Branches -->
    <line x1="32" y1="8" x2="27" y2="16" stroke-linecap="round"/>
    <line x1="32" y1="8" x2="37" y2="16" stroke-linecap="round"/>
    <line x1="32" y1="56" x2="27" y2="48" stroke-linecap="round"/>
    <line x1="32" y1="56" x2="37" y2="48" stroke-linecap="round"/>
    
    <!-- Horizontal Branches -->
    <line x1="8" y1="32" x2="16" y2="27" stroke-linecap="round"/>
    <line x1="8" y1="32" x2="16" y2="37" stroke-linecap="round"/>
    <line x1="56" y1="32" x2="48" y2="27" stroke-linecap="round"/>
    <line x1="56" y1="32" x2="48" y2="37" stroke-linecap="round"/>
    
    <!-- Diagonal 1 Branches -->
    <line x1="14.8" y1="14.8" x2="19" y2="22" stroke-linecap="round"/>
    <line x1="14.8" y1="14.8" x2="22" y2="19" stroke-linecap="round"/>
    <line x1="49.2" y1="49.2" x2="42" y2="45" stroke-linecap="round"/>
    <line x1="49.2" y1="49.2" x2="45" y2="42" stroke-linecap="round"/>
    
    <!-- Diagonal 2 Branches -->
    <line x1="14.8" y1="49.2" x2="22" y2="45" stroke-linecap="round"/>
    <line x1="14.8" y1="49.2" x2="19" y2="42" stroke-linecap="round"/>
    <line x1="49.2" y1="14.8" x2="42" y2="19" stroke-linecap="round"/>
    <line x1="49.2" y1="14.8" x2="45" y2="22" stroke-linecap="round"/>
  </g>
  
  <!-- Center Decoration -->
  <circle cx="32" cy="32" r="4" fill="#7EC8D8"/>
  
  <!-- Small Decorative Elements at Branch Points -->
  <g fill="#F8F9FA">
    <circle cx="32" cy="8" r="1.5"/>
    <circle cx="32" cy="56" r="1.5"/>
    <circle cx="8" cy="32" r="1.5"/>
    <circle cx="56" cy="32" r="1.5"/>
    <circle cx="14.8" cy="14.8" r="1.5"/>
    <circle cx="49.2" cy="49.2" r="1.5"/>
    <circle cx="14.8" cy="49.2" r="1.5"/>
    <circle cx="49.2" cy="14.8" r="1.5"/>
  </g>
</svg>
