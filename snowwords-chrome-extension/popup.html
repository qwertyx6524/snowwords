<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>❄️ Snowwords</h1>
    <p>Vocabulary Helper</p>
  </div>

  <div class="content">
    <!-- Connection Status -->
    <div id="connection-status" class="status checking">
      <div class="status-indicator"></div>
      <span>Checking connection...</span>
    </div>

    <!-- Quick Actions -->
    <div class="section">
      <h3>Quick Actions</h3>
      <div class="actions-grid">
        <button class="action-btn" id="select-word-btn" title="Select text on this page">
          <div class="action-icon">🎯</div>
          <div class="action-text">
            <div class="action-title">Select Word</div>
            <div class="action-desc">Add selected text</div>
          </div>
        </button>
        
        <button class="action-btn" id="open-snowwords-btn" title="Open Snowwords website">
          <div class="action-icon">🏠</div>
          <div class="action-text">
            <div class="action-title">Open Snowwords</div>
            <div class="action-desc">Go to dashboard</div>
          </div>
        </button>
        
        <button class="action-btn" id="practice-btn" title="Start vocabulary practice">
          <div class="action-icon">🧠</div>
          <div class="action-text">
            <div class="action-title">Practice</div>
            <div class="action-desc">Test vocabulary</div>
          </div>
        </button>
        
        <button class="action-btn" id="vocab-list-btn" title="View vocabulary list">
          <div class="action-icon">📚</div>
          <div class="action-text">
            <div class="action-title">My Words</div>
            <div class="action-desc">View collection</div>
          </div>
        </button>
      </div>
    </div>

    <!-- Statistics -->
    <div class="section" id="stats-section">
      <h3>Your Progress</h3>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-icon">📊</div>
          <div class="stat-info">
            <div class="stat-value" id="total-words">--</div>
            <div class="stat-label">Total Words</div>
          </div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">✅</div>
          <div class="stat-info">
            <div class="stat-value" id="mastered-words">--</div>
            <div class="stat-label">Mastered</div>
          </div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">🔥</div>
          <div class="stat-info">
            <div class="stat-value" id="streak">--</div>
            <div class="stat-label">Day Streak</div>
          </div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">📅</div>
          <div class="stat-info">
            <div class="stat-value" id="this-week">--</div>
            <div class="stat-label">This Week</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Keyboard Shortcuts -->
    <div class="section keyboard-shortcuts">
      <h3>Keyboard Shortcuts</h3>
      <div class="shortcut-list">
        <div class="shortcut-item">
          <div class="shortcut-keys">
            <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>A</kbd>
          </div>
          <div class="shortcut-desc">Add selected word</div>
        </div>
        <div class="shortcut-item">
          <div class="shortcut-keys">
            <span class="shortcut-hint">Double-right-click</span>
          </div>
          <div class="shortcut-desc">Quick word selection</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-links">
      <a href="#" id="help-link" class="footer-link">Help</a>
      <a href="#" id="feedback-link" class="footer-link">Feedback</a>
      <a href="#" id="upgrade-link" class="footer-link">Upgrade</a>
    </div>
    <div class="footer-version">v1.0.0</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
